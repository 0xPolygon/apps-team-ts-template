version: 2
updates:
  # One grouped PR per month: each bump costs a human approval in every consumer repo.
  # Only `/` is configured: the docs state `/` covers .github/workflows, and do not
  # document a value for the nested packages/example-frontend/.github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      exclude: ['@polygonlabs/*', '@maticnetwork/*', '@agglayer/*', '@0xsequence/*', '@0xtrails/*']
    groups:
      npm-minor-patch: { patterns: ['*'], update-types: [minor, patch] }
    ignore:
      - dependency-name: '@changesets/cli'
        update-types: ['version-update:semver-major']
